[package]
name = "phi-recorder-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "phi_recorder"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.95"
chrono = "0.4.28"
phi-recorder-core = { path = "renderer-core" }
phi-recorder-protocol = { path = "renderer-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.138"

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
members = ["renderer-protocol", "renderer-host"]

[patch."https://github.com/AntiLeave/miniquad"]
miniquad = { git = "https://github.com/KaedePhiDevelopment/miniquad", rev = "a5fe0cf0bfdac938a0e7609711f55c670cea1afe" }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
