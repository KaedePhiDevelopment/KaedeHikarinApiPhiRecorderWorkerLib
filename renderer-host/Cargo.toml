[package]
name = "phi-renderer-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[[bin]]
name = "phi-renderer-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
async-trait = "0.1"
macroquad = { git = "https://github.com/AntiLeave/macroquad", default-features = false }
num-complex = "0.4.6"
phi-recorder-protocol = { path = "../renderer-protocol" }
phi-recorder-core = { path = "../renderer-core" }
phire = { git = "https://github.com/KaedePhiDevelopment/phire", rev = "d9e89fca81510ead416513e6eff994e91d27c4fd", package = "phire", default-features = false, features = ["log", "video", "silent-audio"] }
realfft = { version = "3.5.0", features = ["avx", "sse"] }
sasa = { git = "https://github.com/KaedePhiDevelopment/sasa", rev = "931bc55d0d1e4b3ec150c18f1a2a51ace8cf7847", default-features = false, features = ["cpal"] }
serde_json = "1.0.138"
tempfile = "3.16.0"
tokio = { version = "1", features = ["rt"] }
